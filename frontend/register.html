<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperChat — Register</title>

    <script>(function(){var t=localStorage.getItem('paperchat-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">📚 PaperChat</div>
            <div class="auth-subtitle">Create your workspace</div>

            <div id="authError" class="auth-error" hidden></div>

            <form id="registerForm">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="username">
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="new-password" minlength="8">
                </div>
                <button type="submit" class="auth-submit" id="submitBtn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script src="register.js"></script>

</body>

</html>
