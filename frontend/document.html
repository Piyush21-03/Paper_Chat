<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperChat — Document Insights</title>

    <script>(function(){var t=localStorage.getItem('paperchat-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="document.css">
</head>

<body data-page="documents">

    <div class="shell-body">

        <aside class="shell-sidebar">
            <div class="shell-logo">📚 PaperChat</div>
            <nav class="shell-nav">
                <a href="index.html" data-nav="documents">📄 Documents</a>
                <a href="chat.html" data-nav="chat">💬 Chat</a>
                <a href="research.html" data-nav="research">🔬 Research</a>
                <a href="search.html" data-nav="search">🔍 Search</a>
                <a href="eval.html" data-nav="evaluation">📊 Evaluation</a>
                <a href="settings.html" data-nav="settings">⚙️ Settings</a>
            </nav>
            <div class="shell-sidebar-footer">PaperChat Research</div>
        </aside>

        <div class="shell-page">

            <header class="header">
                <button id="shellSidebarToggle" class="icon-btn sidebar-mobile-toggle" title="Menu">☰</button>
                <div class="logo">📚 PaperChat</div>
                <div class="tagline"><a href="index.html" class="nav-link">&larr; Documents</a></div>
                <div class="shell-topbar-extra">
                    <div class="workspace-placeholder">Personal workspace</div>
                    <button id="themeToggle" class="theme-toggle-btn" title="Toggle theme">🌙</button>
                </div>
            </header>

            <main class="dash-main" id="insightsMain">
                <div class="search-loading">Loading document…</div>
            </main>

        </div>

    </div>

    <script src="shell.js"></script>
    <script src="document.js"></script>

</body>

</html>
