<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperChat — Log In</title>

    <script>(function(){var t=localStorage.getItem('paperchat-theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();</script>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">📚 PaperChat</div>
            <div class="auth-subtitle">Log in to your workspace</div>

            <div id="authError" class="auth-error" hidden></div>
            <div id="expiredNotice" class="auth-error" hidden>Your session expired. Please log in again.</div>

            <form id="loginForm">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="username">
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="auth-submit" id="submitBtn">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>

</body>

</html>
