# Production stack: PaperChat API + PostgreSQL + Redis + Qdrant.
#
# Local development can keep using the lightweight docker-compose.yml
# (Qdrant only, SQLite on disk) -- this file is for a full deployment.
#
# Usage:
#   cp .env.example .env   # then fill in real values
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-paperchat}:${POSTGRES_PASSWORD:-paperchat}@postgres:5432/${POSTGRES_DB:-paperchat}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: ${JOB_BACKEND:-inline}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY must be set}
    volumes:
      - api_uploads:/app/backend/uploads
      - api_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Optional: a separate RQ worker process consuming background jobs
  # when JOB_BACKEND=rq. Not needed if JOB_BACKEND=inline (default).
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["rq", "worker", "paperchat", "--url", "redis://redis:6379/0"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-paperchat}:${POSTGRES_PASSWORD:-paperchat}@postgres:5432/${POSTGRES_DB:-paperchat}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY must be set}
    volumes:
      - api_uploads:/app/backend/uploads
      - api_storage:/app/backend/storage
    depends_on:
      - redis
      - postgres
    profiles: ["rq"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperchat}
      POSTGRES_DB: ${POSTGRES_DB:-paperchat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperchat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  api_uploads:
  api_storage:
